workflows:
  ios-app-store:
    name: AFU iOS App Store Build
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.afu.volunteerportal"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: "22"
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor to iOS
        script: npx cap sync ios
      - name: Delete stale provisioning profiles
        script: |
          python3 << 'PYEOF'
          import os, time, json, urllib.request
          try:
              import jwt
          except ImportError:
              import subprocess; subprocess.run(['pip3','install','PyJWT','cryptography'],check=True); import jwt

          key_id   = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          issuer   = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          priv_key = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']

          token = jwt.encode(
              {'iss': issuer, 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'},
              priv_key, algorithm='ES256', headers={'kid': key_id}
          )
          hdrs = {'Authorization': f'Bearer {token}'}

          req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=50',
              headers=hdrs
          )
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())

          for p in data.get('data', []):
              pid = p['id']
              name = p.get('attributes', {}).get('name', '?')
              print(f'Deleting profile {pid} ({name})')
              del_req = urllib.request.Request(
                  f'https://api.appstoreconnect.apple.com/v1/profiles/{pid}',
                  headers=hdrs, method='DELETE'
              )
              try:
                  urllib.request.urlopen(del_req)
                  print(f'  Deleted OK')
              except Exception as e:
                  print(f'  Error: {e}')
          PYEOF
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          echo "=== Listing ios/App ==="
          ls ios/App/
          echo "=== Raw xcodebuild showBuildSettings ==="
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>&1 || true
          echo "=== Building IPA ==="
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
