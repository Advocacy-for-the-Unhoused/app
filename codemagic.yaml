workflows:
  ios-app-store:
    name: AFU iOS App Store Build
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.afu.volunteerportal"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: "22"
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor to iOS
        script: npx cap sync ios
      - name: Delete stale provisioning profiles
        script: |
          pip3 install PyJWT cryptography --quiet
          python3 << 'PYEOF'
          import os, time, json, urllib.request, jwt
          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          key_id  = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          issuer  = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          raw_key = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']

          # Normalize escaped newlines (env vars sometimes store \n as literal backslash-n)
          raw_key = raw_key.replace('\\n', '\n')

          # Load EC key via cryptography for robust PEM parsing
          private_key = load_pem_private_key(raw_key.encode(), password=None)

          token = jwt.encode(
              {'iss': issuer, 'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'},
              private_key, algorithm='ES256', headers={'kid': key_id}
          )
          hdrs = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=50',
              headers=hdrs
          )
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())

          profiles = data.get('data', [])
          print(f'Found {len(profiles)} profile(s) to delete')
          for p in profiles:
              pid  = p['id']
              name = p.get('attributes', {}).get('name', '?')
              print(f'Deleting {pid} ({name})')
              del_req = urllib.request.Request(
                  f'https://api.appstoreconnect.apple.com/v1/profiles/{pid}',
                  headers=hdrs, method='DELETE'
              )
              try:
                  urllib.request.urlopen(del_req)
                  print('  OK')
              except Exception as e:
                  print(f'  Error: {e}')
          PYEOF
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          echo "=== Listing ios/App ==="
          ls ios/App/
          echo "=== Raw xcodebuild showBuildSettings ==="
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>&1 || true
          echo "=== Building IPA ==="
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
