workflows:
  ios-app-store:
    name: AFU iOS App Store Build
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.afu.volunteerportal"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: "22"
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor to iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          python3 << 'PYEOF'
          import os
          key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          print('KEY length:', len(key))
          print('KEY first 80:', repr(key[:80]))
          print('Is file path:', os.path.isfile(key.strip()))
          if os.path.isfile(key.strip()):
              key = open(key.strip()).read()
          else:
              key = key.replace('\\n', '\n')
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(key)
          print('FILE first 80:', repr(open('/tmp/asc_key.p8').read()[:80]))
          PYEOF
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:/tmp/asc_key.p8"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles
          keychain add-certificates
          xcode-project use-profiles
          rm -f /tmp/asc_key.p8
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
