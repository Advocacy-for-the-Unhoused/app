workflows:
  ios-app-store:
    name: AFU iOS App Store Build
    max_build_duration: 60
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.afu.volunteerportal"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: "22"
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor to iOS
        script: npx cap sync ios
      - name: Delete stale provisioning profiles
        script: |
          set +e
          echo "Listing iOS App Store profiles via app-store-connect CLI..."
          PROFILES_JSON=$(app-store-connect profiles list \
            --profile-type IOS_APP_STORE \
            --json 2>/dev/null)
          echo "Raw response: $PROFILES_JSON"
          echo "$PROFILES_JSON" | python3 << 'PYEOF'
          import sys, json, subprocess
          raw = sys.stdin.read().strip()
          try:
              data = json.loads(raw) if raw else []
          except Exception as e:
              print(f"Parse error: {e}, raw={raw[:200]}")
              sys.exit(0)
          profiles = data if isinstance(data, list) else data.get('data', [])
          print(f"Found {len(profiles)} profile(s)")
          for p in profiles:
              rid = p.get('id') or p.get('resourceId') or ''
              name = (p.get('attributes') or {}).get('name', '?')
              if not rid:
                  continue
              print(f"Deleting {rid} ({name})")
              r = subprocess.run(
                  ['app-store-connect', 'profiles', 'delete', rid],
                  capture_output=True, text=True
              )
              print(r.stdout or r.stderr or 'OK')
          PYEOF
          echo "Profile cleanup done"
          exit 0
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          echo "=== Listing ios/App ==="
          ls ios/App/
          echo "=== Raw xcodebuild showBuildSettings ==="
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>&1 || true
          echo "=== Building IPA ==="
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
