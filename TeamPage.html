<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team — Advocacy for the Unhoused</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #C8522D;
    --cream:  #F9F6F0;
    --dark:   #1A1311;
    --muted:  rgba(255,255,255,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--cream);
    color: var(--dark);
    padding: 40px 24px 32px;
    text-align: center;
    border-bottom: 4px solid var(--dark);
  }
  header h1 {
    font-family: 'Abril Fatface', serif;
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1;
    color: var(--dark);
  }
  header h1 span { color: var(--orange); font-style: italic; }
  header p {
    margin-top: 10px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--orange);
  }

  /* ── Controls wrapper ── */
  .controls {
    background: var(--dark);
    padding: 20px 16px;
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .filter-btn {
    border: 2px solid rgba(255,255,255,0.3);
    background: transparent;
    color: rgba(255,255,255,0.7);
    padding: 6px 18px;
    border-radius: 999px;
    font-family: 'Montserrat', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .filter-btn.active,
  .filter-btn:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
  }

  /* ── Content area ── */
  #content { padding: 32px 16px 48px; max-width: 1200px; margin: 0 auto; }

  /* ── Branch section ── */
  .branch-section { margin-bottom: 40px; }
  .branch-title {
    font-family: 'Abril Fatface', serif;
    font-size: 1.5rem;
    color: var(--cream);
    border-left: 5px solid var(--orange);
    padding-left: 14px;
    margin-bottom: 20px;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 18px;
  }

  /* ── Card ── */
  .card {
    background: var(--cream);
    border: 3px solid var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-bottom: 16px;
    box-shadow: 6px 6px 0 var(--orange);
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 var(--orange);
  }

  .card-photo {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }
  .card-photo-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Abril Fatface', serif;
    font-size: 2.4rem;
    color: var(--orange);
  }

  .card-name {
    margin-top: 12px;
    padding: 0 10px;
    font-weight: 700;
    font-size: .88rem;
    line-height: 1.3;
    color: var(--dark);
  }
  .card-role {
    margin-top: 4px;
    padding: 0 10px;
    font-size: .75rem;
    color: rgba(26,19,17,0.6);
    line-height: 1.3;
  }
  .card-badge {
    margin-top: 10px;
    padding: 3px 12px;
    background: var(--orange);
    color: #fff;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 16px;
    color: rgba(255,255,255,0.35);
    font-size: 1rem;
    display: none;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 28px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<header>
  <h1>Meet Our <span>Team</span></h1>
  <p>Advocacy for the Unhoused, Inc.</p>
</header>

<div class="controls">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-branch="all">All</button>
  </div>
</div>

<div id="content"></div>
<div class="empty" id="emptyState">No members match your search.</div>

<footer>Updated automatically from the roster spreadsheet.</footer>

<script>
const _d = <?!= JSON.stringify(members) ?>;
const ALL_MEMBERS = Array.isArray(_d) ? _d : [];

const BRANCH_ORDER = ['Hopkinton', 'Holliston', 'Westford', 'Medway'];
const HOPKINTON_ORDER = ['Madhav', 'Dil', 'Yaash', 'Maanya', 'Sanya', 'Nidhi'];

let activeBranch = 'all';

// Build branch filter buttons in BRANCH_ORDER
const branches = [...new Set(ALL_MEMBERS.map(m => m.branch).filter(Boolean))]
  .sort((a, b) => {
    const ai = BRANCH_ORDER.indexOf(a), bi = BRANCH_ORDER.indexOf(b);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a.localeCompare(b);
  });
const filterBar = document.getElementById('filterBar');
branches.forEach(b => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.branch = b;
  btn.textContent = b;
  filterBar.appendChild(btn);
});

filterBar.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeBranch = btn.dataset.branch;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

function render() {
  const filtered = ALL_MEMBERS.filter(m => {
    if (activeBranch !== 'all' && m.branch !== activeBranch) return false;
    return true;
  });

  const content = document.getElementById('content');
  const empty   = document.getElementById('emptyState');

  if (!filtered.length) {
    content.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const grouped = {};
  filtered.forEach(m => {
    const key = m.branch || 'Other';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(m);
  });

  const knownOrder = activeBranch === 'all'
    ? [...BRANCH_ORDER.filter(b => grouped[b]), ...Object.keys(grouped).filter(b => !BRANCH_ORDER.includes(b)).sort()]
    : [activeBranch];

  content.innerHTML = knownOrder.filter(b => grouped[b]).map(branch => `
    <div class="branch-section">
      <div class="branch-title">${escHtml(branch)}</div>
      <div class="grid">
        ${sortMembers(branch, grouped[branch]).map(m => cardHtml(m)).join('')}
      </div>
    </div>
  `).join('');
}

function sortMembers(branch, members) {
  if (branch === 'Hopkinton') {
    return [...members].sort((a, b) => {
      const ai = HOPKINTON_ORDER.findIndex(n => a.name.startsWith(n));
      const bi = HOPKINTON_ORDER.findIndex(n => b.name.startsWith(n));
      const aIdx = ai === -1 ? HOPKINTON_ORDER.length : ai;
      const bIdx = bi === -1 ? HOPKINTON_ORDER.length : bi;
      if (aIdx !== bIdx) return aIdx - bIdx;
      return a.name.localeCompare(b.name);
    });
  }
  return [...members].sort((a, b) => {
    const aP = /president/i.test(a.role) ? 0 : 1;
    const bP = /president/i.test(b.role) ? 0 : 1;
    if (aP !== bP) return aP - bP;
    return a.name.localeCompare(b.name);
  });
}

function cardHtml(m) {
  const initials = m.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const photoEl  = m.photo
    ? `<img class="card-photo" src="${escHtml(m.photo)}" alt="${escHtml(m.name)}" loading="lazy" onerror="this.replaceWith(makePlaceholder('${escHtml(initials)}'))">`
    : `<div class="card-photo-placeholder">${escHtml(initials)}</div>`;
  return `
    <div class="card">
      ${photoEl}
      <div class="card-name">${escHtml(m.name)}</div>
      ${m.role ? `<div class="card-role">${escHtml(m.role)}</div>` : ''}
    </div>`;
}

function makePlaceholder(initials) {
  const div = document.createElement('div');
  div.className = 'card-photo-placeholder';
  div.textContent = initials;
  return div;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
